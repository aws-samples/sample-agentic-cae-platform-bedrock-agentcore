[project]
name = "sample-agentic-cae-platform-bedrock-agentcore"
version = "0.1.0"
description = "Agentic CAE Platform: drawing extraction, Q&A, design optimization, and 3D visualization agents/tools"
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT-0" }

dependencies = [
    "boto3>=1.34,<2",
    "jsonschema>=4.22,<5",
    # JWT validation against Cognito JWKS (RS256). `crypto` extra pulls in
    # `cryptography` for RS256 signature verification.
    "PyJWT[crypto]>=2.8,<3",
]

[project.optional-dependencies]
agents = [
    # Strands Agents SDK for building AgentCore Runtime-hosted agents.
    "strands-agents>=0.1.0",
]
tools = [
    "pymupdf>=1.24,<2",
    "cadquery>=2.4,<3",
    "pymoo>=0.6,<1",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "hypothesis>=6.100,<7",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "tools*", "shared*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests", "agents", "tools", "shared"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
